<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Earth Palette Budgeting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FAFAF9; color: #4A4A4A; }
        
        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

        /* Color Palette Classes */
        .bg-earth-income { background-color: #E68A73; } /* Terra Cotta */
        .bg-earth-expense { background-color: #8F7A6E; } /* Brown */
        .bg-earth-balance { background-color: #A4B494; } /* Sage Green */
        .text-earth-dark { color: #5D5650; }
        
        .editable:hover { background-color: rgba(0,0,0,0.03); cursor: text; border-radius: 4px; padding: 2px;}
        .editable:focus { outline: 2px solid #D28F75; background-color: #fff; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-earth-dark">2026</h1>
            <p class="text-gray-400 text-sm tracking-widest">PERSONAL BUDGETING SYSTEM</p>
        </div>
        <div class="flex gap-2">
            <button onclick="saveData()" class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition">
                <i class="fas fa-save"></i> 儲存變更
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-earth-income text-white p-6 rounded-2xl shadow-sm">
            <h3 class="text-sm opacity-90 mb-1">年度總收入</h3>
            <p class="text-3xl font-bold" id="totalIncomeDisplay">$0</p>
        </div>
        <div class="bg-earth-expense text-white p-6 rounded-2xl shadow-sm">
            <h3 class="text-sm opacity-90 mb-1">年度總支出</h3>
            <p class="text-3xl font-bold" id="totalExpenseDisplay">$0</p>
        </div>
        <div class="bg-earth-balance text-white p-6 rounded-2xl shadow-sm">
            <h3 class="text-sm opacity-90 mb-1">年度總盈餘</h3>
            <p class="text-3xl font-bold" id="netIncomeDisplay">$0</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-8">
        <h3 class="border-l-4 border-earth-expense pl-3 font-bold text-earth-dark mb-6">年度收支趨勢</h3>
        <div class="h-64">
            <canvas id="budgetChart"></canvas>
        </div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-8 overflow-hidden">
        <div class="flex justify-between items-center mb-4">
            <h3 class="border-l-4 border-earth-income pl-3 font-bold text-earth-dark">收入明細表</h3>
            <button onclick="addRow('incomeTable')" class="bg-earth-income text-white px-3 py-1 rounded text-sm hover:opacity-90">+ 新增項目</button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-center" id="incomeTable">
                <thead class="bg-gray-50 text-gray-500">
                    <tr>
                        <th class="p-3 text-left min-w-[150px]">收入項目</th>
                        </tr>
                </thead>
                <tbody class="text-gray-600">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-8 overflow-hidden">
        <div class="flex justify-between items-center mb-4">
            <h3 class="border-l-4 border-earth-expense pl-3 font-bold text-earth-dark">支出明細表</h3>
            <button onclick="addRow('expenseTable')" class="bg-earth-expense text-white px-3 py-1 rounded text-sm hover:opacity-90">+ 新增項目</button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-center" id="expenseTable">
                <thead class="bg-gray-50 text-gray-500">
                    <tr>
                        <th class="p-3 text-left min-w-[150px]">支出項目</th>
                        </tr>
                </thead>
                <tbody class="text-gray-600">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
    // https://script.google.com/macros/s/AKfycbxr3y15NHiXeYvoEZfwBreGgmZi8PDEnQ_vBUaamxOFbvzeGqVN811axgESVDt8xxbJKA/exec
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/你的網址字串/exec"; 

    // Data Structure
    const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    
    // Default Empty Data
    let budgetData = {
        income: [{ name: '載入中...', values: Array(12).fill(0) }],
        expense: [{ name: '載入中...', values: Array(12).fill(0) }]
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadDataFromCloud(); // 改成從雲端讀取
        // 先渲染一次空畫面避免破版
        renderTable('incomeTable', budgetData.income, 'income');
        renderTable('expenseTable', budgetData.expense, 'expense');
        updateDashboard();
        initChart();
    });

    // 1. Render Tables (保持不變)
    function renderTable(tableId, data, type) {
        const table = document.getElementById(tableId);
        const theadRow = table.querySelector('thead tr');
        const tbody = table.querySelector('tbody');

        if (theadRow.children.length === 1) {
            months.forEach(m => {
                const th = document.createElement('th');
                th.className = "p-3 font-light";
                th.innerText = m;
                theadRow.appendChild(th);
            });
            const thTotal = document.createElement('th');
            thTotal.className = "p-3 font-bold text-gray-700";
            thTotal.innerText = "總額";
            theadRow.appendChild(thTotal);
            const thDel = document.createElement('th');
            thDel.className = "p-3";
            theadRow.appendChild(thDel);
        }

        tbody.innerHTML = '';
        data.forEach((row, index) => {
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-50 hover:bg-gray-50 transition";
            
            // Name Input
            let tdName = `
                <td class="p-3 text-left">
                    <div class="font-medium text-gray-700 editable" contenteditable="true" 
                         onblur="updateName('${type}', ${index}, this.innerText)">${row.name}</div>
                    <span class="text-xs ${type === 'income' ? 'bg-orange-100 text-orange-600' : 'bg-gray-100 text-gray-600'} px-1 rounded mt-1 inline-block">類別</span>
                </td>`;
            
            let tdValues = '';
            let rowSum = 0;
            row.values.forEach((val, monthIdx) => {
                rowSum += Number(val);
                const bgClass = type === 'income' ? 'bg-orange-50/50' : 'bg-gray-100/50';
                const hasVal = val > 0 ? bgClass : '';
                tdValues += `<td class="p-3">
                    <div class="editable w-full h-full py-2 ${hasVal} rounded" contenteditable="true" 
                         onblur="updateValue('${type}', ${index}, ${monthIdx}, this.innerText)">${val > 0 ? val : ''}</div>
                </td>`;
            });

            let tdTotal = `<td class="p-3 font-bold text-gray-700">$${rowSum.toLocaleString()}</td>`;
            let tdDel = `<td class="p-3 cursor-pointer text-gray-300 hover:text-red-400" onclick="deleteRow('${type}', ${index})">×</td>`;
            tr.innerHTML = tdName + tdValues + tdTotal + tdDel;
            tbody.appendChild(tr);
        });
    }

    // 2. Logic (微調，儲存時顯示狀態)
    function updateName(type, rowIndex, newName) {
        budgetData[type][rowIndex].name = newName;
        updateDashboard(); // 只更新計算，不立即上傳，避免太頻繁
    }
    function updateValue(type, rowIndex, monthIndex, newValue) {
        const num = parseFloat(newValue.replace(/,/g, '')) || 0;
        budgetData[type][rowIndex].values[monthIndex] = num;
        renderTable(type === 'income' ? 'incomeTable' : 'expenseTable', budgetData[type], type);
        updateDashboard();
    }
    function addRow(tableId) {
        const type = tableId === 'incomeTable' ? 'income' : 'expense';
        budgetData[type].push({ name: '新項目', values: Array(12).fill(0) });
        renderTable(tableId, budgetData[type], type);
    }
    function deleteRow(type, index) {
        if(confirm('確定刪除此項目?')) {
            budgetData[type].splice(index, 1);
            renderTable(type === 'income' ? 'incomeTable' : 'expenseTable', budgetData[type], type);
            updateDashboard();
        }
    }

    // 3. Dashboard & Chart (保持不變)
    let myChart = null;
    function updateDashboard() {
        let monthlyIncome = Array(12).fill(0);
        let monthlyExpense = Array(12).fill(0);
        let totalInc = 0, totalExp = 0;

        budgetData.income.forEach(row => {
            row.values.forEach((v, i) => { monthlyIncome[i] += Number(v); totalInc += Number(v); });
        });
        budgetData.expense.forEach(row => {
            row.values.forEach((v, i) => { monthlyExpense[i] += Number(v); totalExp += Number(v); });
        });

        document.getElementById('totalIncomeDisplay').innerText = '$' + totalInc.toLocaleString();
        document.getElementById('totalExpenseDisplay').innerText = '$' + totalExp.toLocaleString();
        document.getElementById('netIncomeDisplay').innerText = '$' + (totalInc - totalExp).toLocaleString();

        updateChart(monthlyIncome, monthlyExpense);
    }

    function initChart() {
        const ctx = document.getElementById('budgetChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [
                    { label: '收入', data: [], backgroundColor: '#E68A73', borderRadius: 4 },
                    { label: '支出', data: [], backgroundColor: '#8F7A6E', borderRadius: 4 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, grid: { borderDash: [2, 4] } }, x: { grid: { display: false } } },
                plugins: { legend: { position: 'top', align: 'end' } }
            }
        });
    }

    function updateChart(incData, expData) {
        if(myChart) {
            myChart.data.datasets[0].data = incData;
            myChart.data.datasets[1].data = expData;
            myChart.update();
        }
    }

    // 4. Cloud Storage Functions (這是新的!)
    
    // 儲存資料到 Google Sheet
    function saveData() {
        const btn = document.querySelector('button i.fa-save').parentNode;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';
        btn.disabled = true;

        fetch(API_URL, {
            method: "POST",
            mode: "no-cors", // 重要：Google Script 跨域限制
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(budgetData)
        })
        .then(() => {
            // 因為 no-cors，我們收不到回應內容，但通常代表成功發送
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> 已儲存';
                btn.disabled = false;
                setTimeout(() => btn.innerHTML = originalText, 2000);
            }, 1000);
        })
        .catch(err => {
            alert('儲存失敗，請檢查網路');
            console.error(err);
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    }

    // 從 Google Sheet 讀取資料
    function loadDataFromCloud() {
        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            if(data.income.length > 0 || data.expense.length > 0) {
                budgetData = data;
                renderTable('incomeTable', budgetData.income, 'income');
                renderTable('expenseTable', budgetData.expense, 'expense');
                updateDashboard();
            } else {
                // 如果是空的，使用預設值
                budgetData = {
                    income: [{ name: '本薪收入', values: Array(12).fill(50000) }],
                    expense: [{ name: '房租', values: Array(12).fill(12000) }]
                };
                updateDashboard();
            }
        })
        .catch(err => {
            console.error('讀取失敗', err);
            alert('無法讀取雲端資料，請確認網址設定正確');
        });
    }
    </script>
</body>
</html>
